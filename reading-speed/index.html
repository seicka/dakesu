<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ritmo de Lectura · Dakesu Tools</title>
  <meta name="description" content="Calcula con precisión horas y días para terminar novelas de 1.000 a 4.000 capítulos según velocidad WPM.">
  <link rel="canonical" href="https://tools.dakesu.net/reading-speed">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #05070a;
      --text: #f2ede4;
      --text-muted: #807d8a;
      --border: rgba(242, 237, 228, 0.12);
      --hover-bg: rgba(242, 237, 228, 0.05);
      --input-bg: #0d1017;
      --pill-bg: rgba(255, 255, 255, 0.05);
      --pill-border: rgba(255, 255, 255, 0.14);
      --pill-hover-bg: rgba(255, 255, 255, 0.12);
      --pill-text: rgba(255, 255, 255, 0.7);
      --pill-text-active: #ffffff;
      --accent: #e83424;
    }

    [data-theme="light"] {
      --bg: #faf7f2;
      --text: #17181c;
      --text-muted: #72747d;
      --border: rgba(0, 0, 0, 0.08);
      --hover-bg: rgba(0, 0, 0, 0.03);
      --input-bg: #ffffff;
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-border: rgba(0, 0, 0, 0.1);
      --pill-hover-bg: rgba(0, 0, 0, 0.08);
      --pill-text: rgba(0, 0, 0, 0.65);
      --pill-text-active: #000000;
      --accent: #d32f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .back-link {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: var(--text); }

    /* Control Pill Canónico */
    .control-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 6px;
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      font-size: 12px;
      line-height: 1;
    }
    .pill-btn {
      background: transparent;
      border: none;
      color: var(--pill-text);
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .pill-btn:hover { background: var(--pill-hover-bg); color: var(--pill-text-active); }
    .pill-btn-icon { padding: 4px 6px; }
    .pill-divider { color: var(--border); font-size: 11px; user-select: none; padding: 0 2px; }

    /* Header */
    .app-header {
      margin-bottom: 32px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .app-desc {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Grid Layout */
    .calc-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      margin-bottom: 40px;
    }
    @media (max-width: 650px) {
      .calc-layout { grid-template-columns: 1fr; }
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="number"], select {
      width: 100%;
      height: 40px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input[type="number"]:focus, select:focus {
      border-color: var(--text);
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-family: monospace;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--text);
      margin-top: 4px;
    }

    /* Panel de Resultados */
    .result-panel {
      border: 1px solid var(--border);
      background: var(--hover-bg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .metric-val {
      font-size: 18px;
      font-weight: 600;
      font-family: monospace;
    }

    .highlight-box {
      margin-bottom: 20px;
    }
    .highlight-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .highlight-days {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .highlight-verdict {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .copy-btn {
      background: transparent;
      border: none;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
    }
    .copy-btn:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="page">
    
    <header class="top-bar">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        <span>Tools</span>
      </a>

      <!-- Pill Switch Canónico (Mabelcox) -->
      <div class="control-pill" role="toolbar" aria-label="Preferencias">
        <button id="langToggle" class="pill-btn" aria-label="Cambiar idioma">
          <span id="langToggleLabel">EN</span>
        </button>

        <span class="pill-divider" aria-hidden="true">/</span>

        <button id="themeToggle" class="pill-btn pill-btn-icon" aria-label="Cambiar modo de color" title="Cambiar tema">
          <svg class="sun-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-header">
      <h1 class="app-title" data-i18n="rs_title">Calculadora de Ritmo de Lectura</h1>
      <p class="app-desc" data-i18n="tool2_desc">Calcula días y horas para novelas extensas según tu ritmo de lectura y tiempo diario.</p>
    </div>

    <div class="calc-layout">
      <!-- Controles -->
      <div>
        <div class="form-group">
          <label data-i18n="rs_chapters">Capítulos Totales</label>
          <input type="number" id="totalChapters" value="1600" min="1" max="10000">
        </div>

        <div class="form-group">
          <label data-i18n="rs_wpc">Palabras por Capítulo</label>
          <input type="number" id="wordsPerChapter" value="2200" min="500" max="10000" step="100">
        </div>

        <div class="form-group">
          <label data-i18n="rs_wpm">Velocidad (Palabras por minuto)</label>
          <input type="range" id="wpmSlider" min="150" max="500" value="250">
          <div class="slider-row">
            <span>150</span>
            <span id="wpmDisplay" style="color:var(--text);font-weight:600;">250 WPM</span>
            <span>500</span>
          </div>
        </div>

        <div class="form-group">
          <label data-i18n="rs_daily">Dedicación Diaria</label>
          <select id="dailyTime">
            <option value="0.5">30 min / día</option>
            <option value="1">1 h / día</option>
            <option value="2" selected>2 h / día</option>
            <option value="4">4 h / día</option>
            <option value="6">6 h / día</option>
          </select>
        </div>
      </div>

      <!-- Métricas -->
      <div class="result-panel">
        <div>
          <div class="metric-row">
            <div>
              <div class="metric-label">Palabras Totales</div>
              <div class="metric-val" id="metricWords">3.52M</div>
            </div>
            <div>
              <div class="metric-label">Horas Totales</div>
              <div class="metric-val" id="metricHours">234.6 h</div>
            </div>
          </div>

          <div class="highlight-box">
            <div class="highlight-label" data-i18n="rs_result_time">Tiempo total estimado:</div>
            <div class="highlight-days" id="metricDays">117 Días</div>
            <div class="highlight-verdict" id="metricVerdict">Aproximadamente 3.9 meses a este ritmo.</div>
          </div>
        </div>

        <div class="panel-footer">
          <span id="metricBooks">~28 libros estándar</span>
          <button id="copyBtn" class="copy-btn" data-i18n="an_copy">Copiar</button>
        </div>
      </div>
    </div>

  </div>

  <script src="/shared/i18n.js"></script>
  <script>
    function calculate() {
      const chapters = parseInt(document.getElementById('totalChapters').value, 10) || 0;
      const wpc = parseInt(document.getElementById('wordsPerChapter').value, 10) || 0;
      const wpm = parseInt(document.getElementById('wpmSlider').value, 10) || 250;
      const dailyHours = parseFloat(document.getElementById('dailyTime').value) || 2;

      document.getElementById('wpmDisplay').innerText = wpm + ' WPM';

      const totalWords = chapters * wpc;
      const totalMinutes = totalWords / wpm;
      const totalHours = totalMinutes / 60;
      const totalDays = Math.ceil(totalHours / dailyHours);

      document.getElementById('metricWords').innerText = (totalWords / 1000000).toFixed(2) + 'M';
      document.getElementById('metricHours').innerText = totalHours.toFixed(1) + ' h';
      
      const daySuffix = currentLang === 'es' ? 'Días' : 'Days';
      document.getElementById('metricDays').innerText = `${totalDays} ${daySuffix}`;

      const months = (totalDays / 30.5).toFixed(1);
      if (currentLang === 'es') {
        document.getElementById('metricVerdict').innerText = `Aproximadamente ${months} meses leyendo ${dailyHours} hora(s) al día.`;
        const books = Math.round(totalWords / 100000);
        document.getElementById('metricBooks').innerText = `~${books} libros estándar`;
      } else {
        document.getElementById('metricVerdict').innerText = `Approximately ${months} months reading ${dailyHours} hour(s) per day.`;
        const books = Math.round(totalWords / 100000);
        document.getElementById('metricBooks').innerText = `~${books} standard books`;
      }
    }

    document.getElementById('totalChapters').addEventListener('input', calculate);
    document.getElementById('wordsPerChapter').addEventListener('input', calculate);
    document.getElementById('wpmSlider').addEventListener('input', calculate);
    document.getElementById('dailyTime').addEventListener('change', calculate);

    document.getElementById('copyBtn').addEventListener('click', function() {
      navigator.clipboard.writeText(document.getElementById('metricDays').innerText);
      this.innerText = currentLang === 'es' ? '¡Copiado!' : 'Copied!';
      setTimeout(() => {
        this.innerText = currentLang === 'es' ? 'Copiar' : 'Copy';
      }, 1800);
    });

    window.addEventListener('load', calculate);
    window.addEventListener('dakesu:langchange', calculate);
  </script>
</body>
</html>
