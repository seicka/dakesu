<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Nombres Asiáticos · Dakesu Tools</title>
  <meta name="description" content="Generador limpio de nombres en Kanji, Hangul, Chino Wuxia e Hindi con significado etimológico.">
  <link rel="canonical" href="https://tools.dakesu.net/asian-names">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #05070a;
      --text: #f2ede4;
      --text-muted: #807d8a;
      --border: rgba(242, 237, 228, 0.12);
      --hover-bg: rgba(242, 237, 228, 0.05);
      --input-bg: #0d1017;
      --pill-bg: rgba(255, 255, 255, 0.05);
      --pill-border: rgba(255, 255, 255, 0.14);
      --pill-hover-bg: rgba(255, 255, 255, 0.12);
      --pill-text: rgba(255, 255, 255, 0.7);
      --pill-text-active: #ffffff;
      --accent: #e83424;
    }

    [data-theme="light"] {
      --bg: #faf7f2;
      --text: #17181c;
      --text-muted: #72747d;
      --border: rgba(0, 0, 0, 0.08);
      --hover-bg: rgba(0, 0, 0, 0.03);
      --input-bg: #ffffff;
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-border: rgba(0, 0, 0, 0.1);
      --pill-hover-bg: rgba(0, 0, 0, 0.08);
      --pill-text: rgba(0, 0, 0, 0.65);
      --pill-text-active: #000000;
      --accent: #d32f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .back-link {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: var(--text); }

    /* Control Pill Canónico */
    .control-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 6px;
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      font-size: 12px;
      line-height: 1;
    }
    .pill-btn {
      background: transparent;
      border: none;
      color: var(--pill-text);
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .pill-btn:hover { background: var(--pill-hover-bg); color: var(--pill-text-active); }
    .pill-btn-icon { padding: 4px 6px; }
    .pill-divider { color: var(--border); font-size: 11px; user-select: none; padding: 0 2px; }

    /* Header de la App */
    .app-header {
      margin-bottom: 32px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .app-desc {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Formulario Limpio estilo ProWritingAid */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 40px;
    }
    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      height: 40px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    select:focus { border-color: var(--text); }

    .submit-btn {
      height: 40px;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 0 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }
    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:active { transform: scale(0.98); }

    /* Grid de Resultados */
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .results { grid-template-columns: 1fr; }
    }

    .name-card {
      border: 1px solid var(--border);
      background: var(--hover-bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      transition: border-color 0.15s ease;
    }
    .name-card:hover { border-color: var(--text-muted); }

    .name-orig {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .name-romaji {
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
      margin-bottom: 8px;
    }
    .name-meaning {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .name-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .copy-btn {
      align-self: flex-end;
      background: transparent;
      border: none;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 12px;
      padding: 2px 4px;
    }
    .copy-btn:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="page">
    
    <header class="top-bar">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        <span>Tools</span>
      </a>

      <!-- Pill Switch Canónico (Mabelcox) -->
      <div class="control-pill" role="toolbar" aria-label="Preferencias">
        <button id="langToggle" class="pill-btn" aria-label="Cambiar idioma">
          <span id="langToggleLabel">EN</span>
        </button>

        <span class="pill-divider" aria-hidden="true">/</span>

        <button id="themeToggle" class="pill-btn pill-btn-icon" aria-label="Cambiar modo de color" title="Cambiar tema">
          <svg class="sun-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-header">
      <h1 class="app-title" data-i18n="an_title">Generador de Nombres Asiáticos</h1>
      <p class="app-desc" data-i18n="an_desc">Nombres y caracteres para personajes de ficción y novelas.</p>
    </div>

    <div class="controls">
      <div class="field">
        <label data-i18n="an_culture">Cultura</label>
        <select id="cultureSelect">
          <option value="jp" data-i18n="an_jp">Japonés (Kanji)</option>
          <option value="kr" data-i18n="an_kr">Coreano (Hangul)</option>
          <option value="cn" data-i18n="an_cn">Chino (Wuxia / Cultivo)</option>
          <option value="in" data-i18n="an_in">Hindi (Védico)</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="an_archetype">Arquetipo</label>
        <select id="genderSelect">
          <option value="all" data-i18n="an_all">Todos</option>
          <option value="male" data-i18n="an_male">Masculino</option>
          <option value="female" data-i18n="an_female">Femenino</option>
        </select>
      </div>

      <button id="generateBtn" class="submit-btn" data-i18n="an_btn">Generar</button>
    </div>

    <div id="resultsGrid" class="results"></div>

  </div>

  <script src="/shared/i18n.js"></script>
  <script>
    const database = {
      jp: [
        { orig: "黒澤 蓮", romaji: "Kurosawa Ren", meaning: "Pantano negro · Loto sagrado", desc: "Arquetipo de cultivador sombrío o samurái", gender: "male" },
        { orig: "白石 葵", romaji: "Shiraishi Aoi", meaning: "Piedra blanca · Malva azul", desc: "Pureza, resiliencia y nobleza feudal", gender: "female" },
        { orig: "神谷 颯太", romaji: "Kamiya Souta", meaning: "Valle divino · Viento repentino", desc: "Portador de técnicas de viento y velocidad", gender: "male" },
        { orig: "藤堂 桜", romaji: "Toudo Sakura", meaning: "Templo de glicinas · Flor de cerezo", desc: "Linaje de estrategas cortesanos", gender: "female" },
        { orig: "夜神 零", romaji: "Yagami Rei", meaning: "Dios nocturno · Cero absoluto", desc: "Entidad en el umbral del vacío", gender: "all" },
        { orig: "月城 悠", romaji: "Tsukishiro Yuu", meaning: "Castillo lunar · Eternidad serena", desc: "Magia espiritual o reinos astrales", gender: "all" }
      ],
      kr: [
        { orig: "강 하진", romaji: "Kang Ha-jin", meaning: "Río fuerte · Verdad del cielo", desc: "Cazador de rango superior o heredero de gremio", gender: "male" },
        { orig: "서 유나", romaji: "Seo Yu-na", meaning: "Tranquilidad · Gracia radiante", desc: "Sanadora espiritual o diplomática", gender: "female" },
        { orig: "백 도현", romaji: "Baek Do-hyun", meaning: "Blanco puro · Camino virtuoso", desc: "Espadachín de secta tradicional", gender: "male" },
        { orig: "윤 채은", romaji: "Yoon Chae-eun", meaning: "Luz de jade · Bondad sincera", desc: "Erudita arcana de torre mágica", gender: "female" }
      ],
      cn: [
        { orig: "叶 辰", romaji: "Ye Chen", meaning: "Hoja caída · Astro celestial", desc: "Protagonista de superación y cultivo taoísta", gender: "male" },
        { orig: "苏 凌雪", romaji: "Su Lingxue", meaning: "Seda sobria · Nieve en la cumbre", desc: "Hada de hielo o doncella de secta", gender: "female" },
        { orig: "林 傲天", romaji: "Lin Aotian", meaning: "Bosque profundo · Desafiante al cielo", desc: "Genio arrogante o némesis de clan", gender: "male" },
        { orig: "无 尘", romaji: "Wu Chen", meaning: "Cero polvo · Mente inmaculada", desc: "Monje guerrero o maestro ermitaño", gender: "all" }
      ],
      in: [
        { orig: "अर्जुन वर्मा", romaji: "Arjun Verma", meaning: "Luminoso / Puro · Armadura protectora", desc: "Arquero invicto y estratega", gender: "male" },
        { orig: "अनन्या राव", romaji: "Ananya Rao", meaning: "Incomparable · De linaje noble", desc: "Maestra de mantras y oráculos", gender: "female" },
        { orig: "रुद्र कश्यप", romaji: "Rudra Kashyap", meaning: "Manifestación fiera · Sabio védico", desc: "Guerrero asceta de fuego", gender: "male" }
      ]
    };

    function renderNames() {
      const culture = document.getElementById('cultureSelect').value;
      const gender = document.getElementById('genderSelect').value;
      const grid = document.getElementById('resultsGrid');

      let pool = database[culture] || [];
      if (gender !== 'all') {
        const filtered = pool.filter(item => item.gender === gender || item.gender === 'all');
        if (filtered.length > 0) pool = filtered;
      }

      const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, 4);

      grid.innerHTML = shuffled.map(item => `
        <div class="name-card">
          <div>
            <div class="name-orig">${item.orig}</div>
            <div class="name-romaji">${item.romaji}</div>
            <div class="name-meaning">${item.meaning}</div>
            <div class="name-desc">${item.desc}</div>
          </div>
          <button onclick="navigator.clipboard.writeText('${item.orig} (${item.romaji})'); this.innerText = '${currentLang === 'es' ? '¡Copiado!' : 'Copied!'}';" class="copy-btn">
            ${currentLang === 'es' ? 'Copiar' : 'Copy'}
          </button>
        </div>
      `).join('');
    }

    document.getElementById('generateBtn').addEventListener('click', renderNames);
    document.getElementById('cultureSelect').addEventListener('change', renderNames);
    document.getElementById('genderSelect').addEventListener('change', renderNames);

    renderNames();
    window.addEventListener('dakesu:langchange', renderNames);
  </script>
</body>
</html>
