<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dakesu Tools</title>
  <meta name="description" content="Herramientas y utilidades rápidas para fanáticos de novelas asiáticas.">
  <link rel="canonical" href="https://tools.dakesu.net/">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ================================================= Tokens Mabelcox / Torii Clean */
    :root {
      --bg: #05070a;
      --text: #f2ede4;
      --text-muted: #807d8a;
      --border: rgba(242, 237, 228, 0.12);
      --hover-bg: rgba(242, 237, 228, 0.05);
      --pill-bg: rgba(255, 255, 255, 0.05);
      --pill-border: rgba(255, 255, 255, 0.14);
      --pill-hover-bg: rgba(255, 255, 255, 0.12);
      --pill-text: rgba(255, 255, 255, 0.7);
      --pill-text-active: #ffffff;
      --accent: #e83424;
    }

    [data-theme="light"] {
      --bg: #faf7f2;
      --text: #17181c;
      --text-muted: #72747d;
      --border: rgba(0, 0, 0, 0.08);
      --hover-bg: rgba(0, 0, 0, 0.03);
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-border: rgba(0, 0, 0, 0.1);
      --pill-hover-bg: rgba(0, 0, 0, 0.08);
      --pill-text: rgba(0, 0, 0, 0.65);
      --pill-text-active: #000000;
      --accent: #d32f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* Fondo Torii 3D Canvas */
    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
    [data-theme="light"] #gl {
      opacity: 0.2;
      filter: invert(1) hue-rotate(180deg);
    }

    .page {
      position: relative;
      z-index: 10;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Top Bar Simple */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 64px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }

    /* Control Pill Canónico Mabelcox */
    .control-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 6px;
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      font-size: 12px;
      line-height: 1;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--pill-text);
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--pill-hover-bg);
      color: var(--pill-text-active);
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .pill-btn-icon {
      padding: 4px 6px;
    }

    .pill-divider {
      color: var(--border);
      font-size: 11px;
      user-select: none;
      padding: 0 2px;
    }

    /* Lista Limpia de Herramientas: Solo Icono + Nombre + Link */
    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .tool-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--bg);
      text-decoration: none;
      color: var(--text);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .tool-row:hover {
      background: var(--hover-bg);
    }

    .tool-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-icon {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      stroke-width: 1.75;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .tool-row:hover .tool-icon {
      color: var(--accent);
    }

    .tool-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .arrow-icon {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      stroke-width: 1.5;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .tool-row:hover .arrow-icon {
      color: var(--text);
      transform: translateX(3px);
    }

    /* Footer Minimalista */
    .footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- WebGL Torii 3D Limpio -->
  <canvas id="gl"></canvas>

  <div class="page">
    
    <!-- Top Bar con Control Pill Canónico -->
    <header class="top-bar">
      <a href="https://dakesu.net" class="brand-title" data-i18n="site_name">Dakesu Tools</a>

      <!-- Pill Switch Canónico (Mabelcox) -->

        <span class="pill-divider" aria-hidden="true">/</span>

        <button id="themeToggle" class="pill-btn pill-btn-icon" aria-label="Cambiar modo de color" title="Cambiar tema">

            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Luna (Visible en Light) -->
          <svg class="moon-icon" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Lista Ultra-Limpia: Icono SVG + Nombre + Flecha -->
    <main>
      <div class="tools-list">
        
        <!-- Tool 1: Asian Names -->
        <a href="/asian-names" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
            </svg>
            <span class="tool-name" data-i18n="tool1_name">Generador de Nombres Asiáticos</span>

        </a>

        <!-- Tool 2: Reading Speed -->
        <a href="/reading-speed" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="tool-name" data-i18n="tool2_name">Calculadora de Ritmo de Lectura</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 3: Cultivation Realms -->
        <a href="/cultivation-realms" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5" />

          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">

            </svg>
            <span class="tool-name" data-i18n="tool4_name">Diccionario de Términos Daoístas</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />

        <!-- Tool 5: Currency Converter -->

          <div class="tool-left">

            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />

      </div>
    </main>

    <!-- Footer Simple -->
    <footer class="footer">
      <span data-i18n="footer_copy">&copy; 2026 Dakesu. Utilidades sin registro.</span>
      <div style="display:flex; gap:16px;">
        <a href="https://dakesu.net" data-i18n="nav_novels">Novelas</a>
        <a href="https://seicka.net">seicka.net</a>
      </div>
    </footer>

  </div>

  <!-- Torii 3D Script Canónico (Three.js WebGL) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function initToriiBackground() {
      const canvas = document.getElementById('gl');
      if (!canvas || typeof THREE === 'undefined') return;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.2, 5.5);

      // Luz cálida y suave
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xe83424, 1.2);
      dirLight.position.set(2, 4, 3);
      scene.add(dirLight);

      // Geometría estilizada y minimalista de Torii
      const toriiGroup = new THREE.Group();
      const woodMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a1c23,
        roughness: 0.6,
        metalness: 0.1
      });

      // Postes verticales
      const postGeo = new THREE.CylinderGeometry(0.08, 0.09, 3.2, 16);
      const postLeft = new THREE.Mesh(postGeo, woodMaterial);
      postLeft.position.set(-1.2, 0.4, 0);
      postLeft.rotation.z = -0.02;

      const postRight = new THREE.Mesh(postGeo, woodMaterial);
      postRight.position.set(1.2, 0.4, 0);
      postRight.rotation.z = 0.02;

      // Viga superior curva (Kasagi)
      const topBeamGeo = new THREE.BoxGeometry(3.2, 0.14, 0.2);
      const topBeam = new THREE.Mesh(topBeamGeo, woodMaterial);
      topBeam.position.set(0, 1.9, 0);

      // Viga transversal (Nuki)
      const midBeamGeo = new THREE.BoxGeometry(2.7, 0.1, 0.14);
      const midBeam = new THREE.Mesh(midBeamGeo, woodMaterial);
      midBeam.position.set(0, 1.45, 0);

      toriiGroup.add(postLeft, postRight, topBeam, midBeam);
      toriiGroup.position.set(0, -0.6, 0);
      scene.add(toriiGroup);

      // Niebla sutil
      scene.fog = new THREE.FogExp2(0x05070a, 0.12);

      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        toriiGroup.rotation.y = THREE.MathUtils.lerp(toriiGroup.rotation.y, mouseX * 0.15, 0.04);
        toriiGroup.rotation.x = THREE.MathUtils.lerp(toriiGroup.rotation.x, mouseY * 0.08, 0.04);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>

  <script src="/shared/i18n.js"></script>
</body>
</html>
