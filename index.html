<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dakesu Tools</title>
  <meta name="description" content="Herramientas y utilidades rápidas para fanáticos de novelas asiáticas.">
  <link rel="canonical" href="https://tools.dakesu.net/">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#05070a">
  <link rel="apple-touch-icon" href="/icon.svg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Dakesu Tools",
    "url": "https://tools.dakesu.net/",
    "description": "Suite de herramientas y utilidades libres de registro para aficionados a novelas ligeras y ficción oriental.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ================================================= Tokens Mabelcox / Precision Flat */
    :root {
      --bg: #05070a;
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d111a 0%, #05070a 75%);
      --grid-color: rgba(242, 237, 228, 0.05);
      --text: #f2ede4;
      --text-muted: #807d8a;
      --border: rgba(242, 237, 228, 0.12);
      --hover-bg: rgba(242, 237, 228, 0.05);
      --row-bg: #07090e;
      --pill-bg: rgba(255, 255, 255, 0.05);
      --pill-border: rgba(255, 255, 255, 0.14);
      --pill-hover-bg: rgba(255, 255, 255, 0.12);
      --pill-text: rgba(255, 255, 255, 0.7);
      --pill-text-active: #ffffff;
      --accent: #e83424;
    }

    [data-theme="light"] {
      --bg: #faf7f2;
      --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f3eee5 85%);
      --grid-color: rgba(0, 0, 0, 0.04);
      --text: #17181c;
      --text-muted: #72747d;
      --border: rgba(0, 0, 0, 0.08);
      --hover-bg: rgba(0, 0, 0, 0.03);
      --row-bg: #ffffff;
      --pill-bg: rgba(0, 0, 0, 0.04);
      --pill-border: rgba(0, 0, 0, 0.1);
      --pill-hover-bg: rgba(0, 0, 0, 0.08);
      --pill-text: rgba(0, 0, 0, 0.65);
      --pill-text-active: #000000;
      --accent: #d32f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      min-height: 100%;
      height: 100%;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* Grilla Técnica Elegante con Desvanecimiento Radial Central (Mabelcox) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 85%);
    }

    .page {
      position: relative;
      z-index: 10;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Top Bar con PWA Install y Pill */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 64px;
    }

    .pwa-install-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9999px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.15s ease;
    }
    .pwa-install-btn:hover {
      background: var(--pill-hover-bg);
      border-color: var(--text-muted);
    }

    /* Control Pill Canónico Mabelcox */
    .control-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 6px;
      background: var(--pill-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--pill-border);
      border-radius: 9999px;
      font-size: 12px;
      line-height: 1;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--pill-text);
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--pill-hover-bg);
      color: var(--pill-text-active);
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    .pill-btn-icon {
      padding: 4px 6px;
    }

    .pill-divider {
      color: var(--border);
      font-size: 11px;
      user-select: none;
      padding: 0 2px;
    }

    /* Lista Limpia de Herramientas: Solo Icono + Nombre + Link */
    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .tool-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: var(--row-bg);
      text-decoration: none;
      color: var(--text);
      transition: background-color 0.15s ease;
    }

    .tool-row:hover {
      background: var(--hover-bg);
    }

    .tool-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-icon {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      stroke-width: 1.75;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .tool-row:hover .tool-icon {
      color: var(--accent);
    }

    .tool-name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .arrow-icon {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      stroke-width: 1.5;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .tool-row:hover .arrow-icon {
      color: var(--text);
      transform: translateX(3px);
    }

    /* Footer Minimalista */
    .footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="page">
    
    <!-- Top Bar con Control Pill Canónico -->
    <header class="top-bar">
      <!-- Botón de Instalación PWA (Android / iOS / Desktop) -->
      <button id="pwaInstallBtn" class="pwa-install-btn" title="Instalar aplicación en dispositivo" aria-label="Instalar app">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span data-i18n="pwa_install_btn">Instalar App</span>
      </button>

      <!-- Pill Switch Canónico (Mabelcox) -->
      <div class="control-pill" role="toolbar" aria-label="Preferencias de visualización">
        <button id="langToggle" class="pill-btn" aria-label="Cambiar idioma">
          <span id="langToggleLabel">EN</span>
        </button>

        <span class="pill-divider" aria-hidden="true">/</span>

        <button id="themeToggle" class="pill-btn pill-btn-icon" aria-label="Cambiar modo de color" title="Cambiar tema">
          <!-- Sol (Visible en Dark) -->
          <svg class="sun-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Luna (Visible en Light) -->
          <svg class="moon-icon" style="display:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Lista Ultra-Limpia: Icono SVG + Nombre + Flecha -->
    <main>
      <div class="tools-list">
        
        <!-- Tool 1: Asian Names -->
        <a href="/asian-names" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
            </svg>
            <span class="tool-name" data-i18n="tool1_name">Generador de Nombres Asiáticos</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 2: Reading Speed -->
        <a href="/reading-speed" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="tool-name" data-i18n="tool2_name">Calculadora de Ritmo de Lectura</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 3: Cultivation Realms -->
        <a href="/cultivation-realms" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5" />
            </svg>
            <span class="tool-name" data-i18n="tool3_name">Reinos de Cultivo Xianxia</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 4: Daoist Glossary -->
        <a href="/daoist-glossary" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
            </svg>
            <span class="tool-name" data-i18n="tool4_name">Diccionario de Términos Daoístas</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 5: Currency Converter -->
        <a href="/currency-converter" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="tool-name" data-i18n="tool5_name">Conversor de Monedas Fantásticas</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

        <!-- Tool 6: Sect Generator -->
        <a href="/sect-generator" class="tool-row">
          <div class="tool-left">
            <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z" />
            </svg>
            <span class="tool-name" data-i18n="tool6_name">Generador de Sectas y Clanes</span>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </a>

      </div>
    </main>

    <!-- Footer Simple -->
    <footer class="footer">
      <span data-i18n="footer_copy">© 2026 Dakesu. Ecosistema de Ficción y Novelas Orientales.</span>
      <div style="display:flex; gap:16px;">
        <a href="https://dakesu.net" data-i18n="nav_novels">Novelas</a>
        <a href="https://seicka.net">seicka.net</a>
      </div>
    </footer>

  </div>

  <script src="/shared/petals.js"></script>
  <script src="/shared/i18n.js"></script>
</body>
</html>
